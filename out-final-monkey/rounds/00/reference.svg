<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <title>Monkey climbing an apple tree</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#cfe9ff"/>
      <stop offset="1" stop-color="#8fc3f0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7ccf5a"/>
      <stop offset="1" stop-color="#3a8a2e"/>
    </radialGradient>
    <radialGradient id="apple" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff7b6b"/>
      <stop offset="1" stop-color="#c0141c"/>
    </radialGradient>
    <linearGradient id="bark" x1="0" x2="1">
      <stop offset="0" stop-color="#5a3a1e"/>
      <stop offset="0.5" stop-color="#8a5a32"/>
      <stop offset="1" stop-color="#4a2e16"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc24a"/>
      <stop offset="1" stop-color="#3f8f2f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="500" fill="url(#sky)"/>
  <circle cx="330" cy="70" r="34" fill="#fff4b0" opacity="0.9"/>
  <g fill="#fff" opacity="0.85">
    <ellipse cx="80" cy="80" rx="34" ry="14"/>
    <ellipse cx="100" cy="70" rx="24" ry="14"/>
    <ellipse cx="60" cy="72" rx="20" ry="12"/>
  </g>
  <rect y="420" width="400" height="80" fill="url(#grass)"/>
  <path d="M0 425 Q 60 410 120 425 T 240 425 T 400 425 V 500 H 0 Z" fill="#4f9f3b"/>

  <!-- trunk and branches -->
  <path d="M175 430 C 180 360 170 300 185 240 C 190 210 195 190 200 170 L 220 170 C 222 200 230 260 232 300 C 236 360 240 400 245 430 Z" fill="url(#bark)"/>
  <path d="M198 220 C 160 200 130 190 110 160" stroke="#6b4423" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M222 215 C 260 200 290 190 300 150" stroke="#6b4423" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M205 180 C 190 150 170 130 150 120" stroke="#6b4423" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M215 175 C 240 150 250 130 270 115" stroke="#6b4423" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- bark lines -->
  <g stroke="#3f2612" stroke-width="2" opacity="0.6" fill="none">
    <path d="M190 300 q 4 30 2 60"/>
    <path d="M215 260 q -3 40 1 80"/>
    <path d="M205 350 q 6 25 3 50"/>
  </g>

  <!-- canopy -->
  <g fill="url(#leaf)">
    <circle cx="210" cy="110" r="78"/>
    <circle cx="130" cy="140" r="58"/>
    <circle cx="290" cy="135" r="60"/>
    <circle cx="170" cy="80" r="50"/>
    <circle cx="255" cy="75" r="52"/>
    <circle cx="110" cy="190" r="40"/>
    <circle cx="310" cy="190" r="42"/>
    <circle cx="210" cy="190" r="48"/>
  </g>
  <!-- leaf highlights -->
  <g fill="#9ee07a" opacity="0.5">
    <circle cx="180" cy="60" r="18"/>
    <circle cx="250" cy="55" r="14"/>
    <circle cx="120" cy="125" r="12"/>
    <circle cx="300" cy="115" r="12"/>
  </g>

  <!-- apples -->
  <g>
    <g transform="translate(150 110)">
      <circle r="12" fill="url(#apple)"/><path d="M0 -11 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(240 100)">
      <circle r="13" fill="url(#apple)"/><path d="M0 -12 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(290 160)">
      <circle r="12" fill="url(#apple)"/><path d="M0 -11 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(115 170)">
      <circle r="11" fill="url(#apple)"/><path d="M0 -10 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(200 160)">
      <circle r="12" fill="url(#apple)"/><path d="M0 -11 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(265 200)">
      <circle r="11" fill="url(#apple)"/><path d="M0 -10 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(175 215)">
      <circle r="11" fill="url(#apple)"/><path d="M0 -10 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(320 220)">
      <circle r="10" fill="url(#apple)"/><path d="M0 -9 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>
    </g>
  </g>
  <!-- fallen apple -->
  <circle cx="300" cy="440" r="11" fill="url(#apple)"/>
  <path d="M300 429 q 2 -6 5 -8" stroke="#4a2e16" stroke-width="2" fill="none"/>

  <!-- monkey -->
  <g>
    <!-- tail -->
    <path d="M232 345 C 270 350 290 380 275 405 C 265 420 245 415 248 398" stroke="#7a4a22" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- far leg (behind trunk) -->
    <path d="M200 350 C 185 360 180 380 195 392" stroke="#7a4a22" stroke-width="13" fill="none" stroke-linecap="round"/>
    <!-- far arm (behind trunk) -->
    <path d="M205 300 C 185 290 178 270 190 258" stroke="#7a4a22" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="228" cy="330" rx="28" ry="40" fill="#8b5a2b"/>
    <ellipse cx="228" cy="336" rx="17" ry="28" fill="#d9a877"/>
    <!-- near leg wrapped around trunk -->
    <path d="M240 362 C 262 375 252 400 232 398" stroke="#8b5a2b" stroke-width="14" fill="none" stroke-linecap="round"/>
    <ellipse cx="230" cy="400" rx="10" ry="7" fill="#d9a877"/>
    <!-- near arm reaching up for apple -->
    <path d="M240 298 C 258 280 258 250 248 232" stroke="#8b5a2b" stroke-width="13" fill="none" stroke-linecap="round"/>
    <ellipse cx="246" cy="228" rx="9" ry="8" fill="#d9a877"/>
    <!-- apple in hand -->
    <circle cx="252" cy="218" r="9" fill="url(#apple)"/>
    <!-- head -->
    <circle cx="225" cy="280" r="26" fill="#8b5a2b"/>
    <circle cx="200" cy="276" r="9" fill="#8b5a2b"/>
    <circle cx="250" cy="276" r="9" fill="#8b5a2b"/>
    <circle cx="200" cy="276" r="5" fill="#d9a877"/>
    <circle cx="250" cy="276" r="5" fill="#d9a877"/>
    <path d="M207 284 C 207 265 243 265 243 284 C 245 300 205 300 207 284 Z" fill="#d9a877"/>
    <circle cx="218" cy="276" r="4" fill="#1a1a1a"/>
    <circle cx="232" cy="276" r="4" fill="#1a1a1a"/>
    <circle cx="219.5" cy="274.5" r="1.4" fill="#fff"/>
    <circle cx="233.5" cy="274.5" r="1.4" fill="#fff"/>
    <ellipse cx="223" cy="285" rx="2" ry="1.5" fill="#5a3a1e"/>
    <ellipse cx="228" cy="285" rx="2" ry="1.5" fill="#5a3a1e"/>
    <path d="M216 291 Q 225 299 234 291" stroke="#5a3a1e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- hair tuft -->
    <path d="M220 256 q 4 -10 10 -2 q 2 -8 8 0" stroke="#5a3a1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>

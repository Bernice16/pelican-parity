<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecbf0"/>
      <stop offset="1" stop-color="#e3f3fb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="42" fill="#ffd95c"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="140" cy="90" rx="55" ry="22"/>
    <ellipse cx="175" cy="78" rx="40" ry="26"/>
    <ellipse cx="520" cy="60" rx="45" ry="18"/>
    <ellipse cx="548" cy="50" rx="30" ry="20"/>
  </g>
  <rect y="430" width="800" height="70" fill="#7cb46b"/>
  <rect y="425" width="800" height="12" fill="#5f9552"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <circle cx="220" cy="380" r="70" stroke="#222" stroke-width="10"/>
    <circle cx="560" cy="380" r="70" stroke="#222" stroke-width="10"/>
    <circle cx="220" cy="380" r="60" stroke="#999" stroke-width="2"/>
    <circle cx="560" cy="380" r="60" stroke="#999" stroke-width="2"/>
    <g stroke="#aaa" stroke-width="2">
      <line x1="220" y1="310" x2="220" y2="450"/>
      <line x1="150" y1="380" x2="290" y2="380"/>
      <line x1="170" y1="330" x2="270" y2="430"/>
      <line x1="170" y1="430" x2="270" y2="330"/>
      <line x1="560" y1="310" x2="560" y2="450"/>
      <line x1="490" y1="380" x2="630" y2="380"/>
      <line x1="510" y1="330" x2="610" y2="430"/>
      <line x1="510" y1="430" x2="610" y2="330"/>
    </g>
    <!-- frame -->
    <g stroke="#d9452b" stroke-width="9">
      <line x1="220" y1="380" x2="390" y2="380"/>
      <line x1="390" y1="380" x2="340" y2="240"/>
      <line x1="220" y1="380" x2="340" y2="240"/>
      <line x1="340" y1="240" x2="500" y2="250"/>
      <line x1="390" y1="380" x2="500" y2="250"/>
      <line x1="500" y1="250" x2="560" y2="380"/>
    </g>
    <!-- seat post, handlebars -->
    <line x1="340" y1="240" x2="335" y2="222" stroke="#555"/>
    <line x1="500" y1="250" x2="492" y2="210" stroke="#555"/>
    <path d="M470 212 Q492 200 514 214" stroke="#333" stroke-width="7"/>
    <!-- chainring and cranks -->
    <circle cx="390" cy="380" r="22" stroke="#555" stroke-width="5"/>
    <circle cx="220" cy="380" r="9" stroke="#555" stroke-width="4"/>
    <line x1="235" y1="371" x2="390" y2="358" stroke="#555" stroke-width="3"/>
    <line x1="230" y1="389" x2="392" y2="402" stroke="#555" stroke-width="3"/>
    <line x1="355" y1="360" x2="425" y2="400" stroke="#333" stroke-width="7"/>
    <rect x="412" y="394" width="26" height="10" fill="#333" stroke="none"/>
    <rect x="342" y="355" width="26" height="10" fill="#333" stroke="none"/>
  </g>
  <!-- seat -->
  <ellipse cx="335" cy="220" rx="32" ry="10" fill="#4a2f1b"/>

  <!-- Pelican -->
  <!-- legs -->
  <g stroke="#f0a030" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M330 255 L350 330 L355 362"/>
    <path d="M345 255 L395 330 L425 398"/>
  </g>
  <g fill="#f0a030">
    <path d="M340 362 L368 356 L372 368 L348 372 Z"/>
    <path d="M410 398 L438 390 L442 404 L418 410 Z"/>
  </g>

  <!-- tail -->
  <path d="M250 205 L200 185 L215 215 L195 240 L245 235 Z" fill="#e8e8e8" stroke="#bbb" stroke-width="2"/>

  <!-- body -->
  <ellipse cx="330" cy="205" rx="92" ry="58" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="3" transform="rotate(-8 330 205)"/>

  <!-- wing reaching the handlebar -->
  <path d="M300 190 Q370 150 490 208 Q400 215 345 240 Q320 230 300 190 Z" fill="#e6e6e6" stroke="#bdbdbd" stroke-width="3"/>
  <path d="M330 200 Q400 185 470 207" fill="none" stroke="#cfcfcf" stroke-width="2"/>
  <path d="M325 215 Q395 200 455 215" fill="none" stroke="#cfcfcf" stroke-width="2"/>

  <!-- neck -->
  <path d="M395 175 C 430 160, 440 120, 455 95" fill="none" stroke="#f7f7f7" stroke-width="30" stroke-linecap="round"/>
  <path d="M395 175 C 430 160, 440 120, 455 95" fill="none" stroke="#c9c9c9" stroke-width="34" stroke-linecap="round" opacity="0.35"/>
  <path d="M395 175 C 430 160, 440 120, 455 95" fill="none" stroke="#f7f7f7" stroke-width="28" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="468" cy="82" r="28" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="3"/>
  <path d="M452 58 Q470 40 490 56 Q476 56 452 58 Z" fill="#ededed"/>

  <!-- beak + pouch -->
  <path d="M486 72 L600 92 L590 100 L488 92 Z" fill="#f5b942" stroke="#d69a25" stroke-width="2" stroke-linejoin="round"/>
  <path d="M488 92 L590 100 Q560 140 505 128 Q488 115 488 92 Z" fill="#f2a24a" stroke="#d69a25" stroke-width="2" stroke-linejoin="round"/>
  <line x1="488" y1="92" x2="590" y2="100" stroke="#b87a18" stroke-width="2"/>

  <!-- eye -->
  <circle cx="478" cy="76" r="6" fill="#222"/>
  <circle cx="480" cy="74" r="2" fill="#fff"/>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="300" x2="110" y2="300"/>
    <line x1="40" y1="330" x2="100" y2="330"/>
    <line x1="70" y1="360" x2="120" y2="360"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="leaf" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7ccf5a"/>
      <stop offset="100%" stop-color="#2f7d32"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" x2="1">
      <stop offset="0%" stop-color="#7a4a24"/>
      <stop offset="50%" stop-color="#a0632f"/>
      <stop offset="100%" stop-color="#5e3718"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad7ff"/>
      <stop offset="100%" stop-color="#e6f6ff"/>
    </linearGradient>
    <radialGradient id="apple" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#b3121b"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="500" fill="url(#sky)"/>
  <circle cx="340" cy="60" r="28" fill="#ffe66d"/>
  <ellipse cx="200" cy="470" rx="220" ry="40" fill="#6fbf55"/>
  <ellipse cx="200" cy="480" rx="90" ry="14" fill="#4d9a3d" opacity="0.6"/>

  <!-- trunk -->
  <path d="M180 470 Q175 380 182 300 Q186 240 190 200 L210 200 Q214 240 218 300 Q225 380 220 470 Z" fill="url(#trunk)"/>
  <path d="M190 200 Q150 170 110 165" stroke="#7a4a24" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M210 200 Q250 160 300 150" stroke="#7a4a24" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M200 205 Q205 150 230 110" stroke="#7a4a24" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M196 230 Q150 215 125 225" stroke="#7a4a24" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- bark lines -->
  <path d="M192 300 q-3 40 0 80 M208 320 q4 50 0 100" stroke="#5e3718" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- foliage -->
  <g fill="url(#leaf)">
    <circle cx="200" cy="120" r="75"/>
    <circle cx="120" cy="150" r="58"/>
    <circle cx="285" cy="140" r="62"/>
    <circle cx="150" cy="95" r="50"/>
    <circle cx="255" cy="85" r="52"/>
    <circle cx="200" cy="175" r="60"/>
    <circle cx="105" cy="205" r="42"/>
    <circle cx="300" cy="200" r="45"/>
  </g>

  <!-- apples -->
  <g>
    <g transform="translate(140 130)"><circle r="11" fill="url(#apple)"/><path d="M0 -10 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/><ellipse cx="4" cy="-9" rx="4" ry="2" fill="#4caf50" transform="rotate(-30 4 -9)"/></g>
    <g transform="translate(215 95)"><circle r="12" fill="url(#apple)"/><path d="M0 -11 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/><ellipse cx="4" cy="-10" rx="4" ry="2" fill="#4caf50" transform="rotate(-30 4 -10)"/></g>
    <g transform="translate(275 170)"><circle r="11" fill="url(#apple)"/><path d="M0 -10 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/><ellipse cx="4" cy="-9" rx="4" ry="2" fill="#4caf50" transform="rotate(-30 4 -9)"/></g>
    <g transform="translate(100 190)"><circle r="10" fill="url(#apple)"/><path d="M0 -9 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/></g>
    <g transform="translate(240 150)"><circle r="11" fill="url(#apple)"/><path d="M0 -10 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/></g>
    <g transform="translate(170 200)"><circle r="10" fill="url(#apple)"/><path d="M0 -9 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/></g>
    <g transform="translate(310 220)"><circle r="10" fill="url(#apple)"/><path d="M0 -9 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/></g>
    <g transform="translate(265 70)"><circle r="10" fill="url(#apple)"/><path d="M0 -9 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/></g>
    <!-- fallen apple -->
    <g transform="translate(290 455)"><circle r="10" fill="url(#apple)"/><path d="M0 -9 q2 -6 5 -8" stroke="#5e3718" stroke-width="2" fill="none"/></g>
  </g>

  <!-- monkey climbing the trunk -->
  <g>
    <!-- tail -->
    <path d="M225 400 Q265 420 260 455 Q255 480 230 470" stroke="#8a5a2b" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- back leg (right, gripping trunk) -->
    <path d="M228 390 Q250 400 240 420 Q230 435 212 425" stroke="#8a5a2b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- front leg (left, pushing on trunk) -->
    <path d="M200 395 Q170 405 178 430" stroke="#8a5a2b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="178" cy="432" r="7" fill="#d8a06c"/>
    <circle cx="212" cy="425" r="7" fill="#d8a06c"/>
    <!-- body -->
    <ellipse cx="215" cy="365" rx="27" ry="40" fill="#8a5a2b" transform="rotate(-8 215 365)"/>
    <ellipse cx="217" cy="368" rx="17" ry="28" fill="#d8a06c" transform="rotate(-8 217 368)"/>
    <!-- arms reaching up and around trunk -->
    <path d="M205 335 Q180 320 185 295" stroke="#8a5a2b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M230 335 Q245 310 228 285" stroke="#8a5a2b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="185" cy="292" r="7" fill="#d8a06c"/>
    <circle cx="228" cy="283" r="7" fill="#d8a06c"/>
    <!-- head -->
    <circle cx="222" cy="310" r="24" fill="#8a5a2b"/>
    <circle cx="200" cy="305" r="8" fill="#8a5a2b"/>
    <circle cx="244" cy="305" r="8" fill="#8a5a2b"/>
    <circle cx="200" cy="305" r="4" fill="#d8a06c"/>
    <circle cx="244" cy="305" r="4" fill="#d8a06c"/>
    <!-- face -->
    <path d="M205 305 a17 17 0 0 1 34 0 a17 20 0 0 1 -34 0 z" fill="#d8a06c"/>
    <circle cx="214" cy="304" r="3.5" fill="#1b1b1b"/>
    <circle cx="230" cy="304" r="3.5" fill="#1b1b1b"/>
    <circle cx="215" cy="303" r="1" fill="#fff"/>
    <circle cx="231" cy="303" r="1" fill="#fff"/>
    <ellipse cx="222" cy="314" rx="4" ry="2.5" fill="#6b3f1b"/>
    <path d="M213 320 q9 7 18 0" stroke="#4a2a10" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- tuft -->
    <path d="M216 288 q6 -10 12 0" stroke="#8a5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- small leaves on ground -->
  <ellipse cx="120" cy="462" rx="7" ry="3" fill="#3f8f3a" transform="rotate(-20 120 462)"/>
  <ellipse cx="330" cy="470" rx="7" ry="3" fill="#3f8f3a" transform="rotate(25 330 470)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Sky -->
  <rect width="400" height="500" fill="#bfe6ff"/>
  <!-- Sun (smaller, fully inside the sky, background) -->
  <circle cx="330" cy="75" r="40" fill="#ffe27a" opacity="0.6"/>
  <!-- Ground -->
  <rect y="440" width="400" height="60" fill="#7cc35a"/>
  <path d="M0 440 Q100 425 200 440 T400 440 L400 445 L0 445 Z" fill="#6ab04c"/>

  <!-- Tree trunk -->
  <path d="M175 440 L165 260 Q160 230 140 210 L155 205 Q178 225 185 255 L200 255 Q210 225 235 200 L248 210 Q225 232 222 262 L228 440 Z" fill="#8b5a2b"/>

  <!-- Canopy -->
  <g fill="#3f9b3a">
    <circle cx="200" cy="170" r="75"/>
    <circle cx="140" cy="200" r="55"/>
    <circle cx="265" cy="195" r="58"/>
    <circle cx="200" cy="110" r="55"/>
    <circle cx="120" cy="140" r="40"/>
    <circle cx="285" cy="130" r="42"/>
  </g>
  <g fill="#56b84c">
    <circle cx="185" cy="150" r="30"/>
    <circle cx="255" cy="165" r="25"/>
  </g>

  <!-- Apples -->
  <g>
    <circle cx="160" cy="130" r="10" fill="#d62828"/>
    <circle cx="232" cy="110" r="10" fill="#d62828"/>
    <circle cx="275" cy="160" r="10" fill="#d62828"/>
    <circle cx="120" cy="180" r="10" fill="#d62828"/>
    <circle cx="205" cy="180" r="10" fill="#d62828"/>
    <circle cx="300" cy="200" r="10" fill="#d62828"/>
    <circle cx="170" cy="210" r="9" fill="#e63946"/>
    <path d="M160 120 Q163 114 166 120" stroke="#2d6a2d" stroke-width="2" fill="none"/>
    <path d="M232 100 Q235 94 238 100" stroke="#2d6a2d" stroke-width="2" fill="none"/>
    <path d="M275 150 Q278 144 281 150" stroke="#2d6a2d" stroke-width="2" fill="none"/>
  </g>

  <!-- Monkey climbing the trunk -->
  <g id="monkey">
    <!-- Tail (clearly visible, curling off the side) -->
    <path d="M184 336 Q164 330 160 310 Q157 292 170 284" stroke="#7a4a1e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="200" cy="320" rx="22" ry="28" fill="#a0692f"/>
    <!-- Belly -->
    <ellipse cx="200" cy="325" rx="13" ry="18" fill="#e8c39e"/>

    <!-- Left arm reaching up the trunk (from shoulder, out and up to hand on trunk) -->
    <path d="M184 306 Q166 296 166 272" stroke="#8b5a2b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Right arm reaching up the trunk -->
    <path d="M216 304 Q234 294 234 270" stroke="#a0692f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Hands wrapping around the trunk edges -->
    <path d="M166 272 Q160 266 166 260 Q172 258 174 264" stroke="#5c3a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M234 270 Q240 264 234 258 Q228 256 226 262" stroke="#5c3a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Legs gripping the trunk -->
    <path d="M190 344 Q178 356 184 370" stroke="#8b5a2b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M210 344 Q222 356 216 370" stroke="#a0692f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Feet wrapping around trunk -->
    <path d="M176 372 Q184 378 194 374" stroke="#5c3a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M224 372 Q216 378 206 374" stroke="#5c3a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="200" cy="282" r="20" fill="#a0692f"/>
    <!-- Ears (clearly separate, on the sides of the head) -->
    <circle cx="180" cy="274" r="6" fill="#8b5a2b"/>
    <circle cx="220" cy="274" r="6" fill="#8b5a2b"/>
    <!-- Face -->
    <ellipse cx="200" cy="288" rx="12" ry="10" fill="#e8c39e"/>
    <!-- Eyes -->
    <circle cx="194" cy="279" r="2.5" fill="#1a1a1a"/>
    <circle cx="206" cy="279" r="2.5" fill="#1a1a1a"/>
    <circle cx="195" cy="278" r="0.8" fill="#fff"/>
    <circle cx="207" cy="278" r="0.8" fill="#fff"/>
    <!-- Nose and smile -->
    <ellipse cx="200" cy="287" rx="2.5" ry="1.8" fill="#5c3a1a"/>
    <path d="M194 292 Q200 297 206 292" stroke="#5c3a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="200" y="478" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2d4a22">A monkey climbing an apple tree</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Sky -->
  <rect width="400" height="500" fill="#bfe6ff"/>
  <!-- Sun: saturated gold with a soft glow so it stands out against the sky -->
  <circle cx="330" cy="75" r="50" fill="#ffd60a" opacity="0.35"/>
  <circle cx="330" cy="75" r="36" fill="#ffb703"/>
  <!-- Ground -->
  <rect y="440" width="400" height="60" fill="#7cc35a"/>
  <path d="M0 440 Q100 425 200 440 T400 440 L400 445 L0 445 Z" fill="#6ab04c"/>

  <!-- Tree trunk -->
  <path d="M175 440 L165 260 Q160 230 140 210 L155 205 Q178 225 185 255 L200 255 Q210 225 235 200 L248 210 Q225 232 222 262 L228 440 Z" fill="#8b5a2b"/>

  <!-- Canopy -->
  <g fill="#3f9b3a">
    <circle cx="200" cy="170" r="75"/>
    <circle cx="140" cy="200" r="55"/>
    <circle cx="265" cy="195" r="58"/>
    <circle cx="200" cy="110" r="55"/>
    <circle cx="120" cy="140" r="40"/>
    <circle cx="285" cy="130" r="42"/>
  </g>
  <g fill="#56b84c">
    <circle cx="185" cy="150" r="30"/>
    <circle cx="255" cy="165" r="25"/>
  </g>

  <!-- Apples: all the same red, each with a stem -->
  <g fill="#d62828">
    <circle cx="160" cy="130" r="10"/>
    <circle cx="232" cy="110" r="10"/>
    <circle cx="275" cy="160" r="10"/>
    <circle cx="120" cy="180" r="10"/>
    <circle cx="205" cy="180" r="10"/>
    <circle cx="300" cy="200" r="10"/>
    <circle cx="170" cy="210" r="10"/>
  </g>
  <g stroke="#2d6a2d" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M160 120 L161 113 Q164 110 166 113"/>
    <path d="M232 100 L233 93 Q236 90 238 93"/>
    <path d="M275 150 L276 143 Q279 140 281 143"/>
    <path d="M120 170 L121 163 Q124 160 126 163"/>
    <path d="M205 170 L206 163 Q209 160 211 163"/>
    <path d="M300 190 L301 183 Q304 180 306 183"/>
    <path d="M170 200 L171 193 Q174 190 176 193"/>
  </g>

  <!-- Monkey climbing the trunk: two arms, two legs, one tail -->
  <g id="monkey">
    <!-- Tail: separate, curling off to the left side of the body -->
    <path d="M182 336 Q150 336 146 310 Q144 290 160 286" stroke="#7a4a1e" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Legs: joined to the hips, running down to the trunk -->
    <path d="M190 336 Q180 350 182 368" stroke="#8b5a2b" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M210 336 Q220 350 218 368" stroke="#a0692f" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Feet: wrapped around the trunk, attached to the ends of the legs -->
    <ellipse cx="180" cy="374" rx="8" ry="5" fill="#5c3a1a"/>
    <ellipse cx="220" cy="374" rx="8" ry="5" fill="#5c3a1a"/>

    <!-- Body -->
    <ellipse cx="200" cy="320" rx="22" ry="28" fill="#a0692f"/>
    <!-- Belly -->
    <ellipse cx="200" cy="325" rx="13" ry="18" fill="#e8c39e"/>

    <!-- Arms: joined to the shoulders, reaching to the trunk -->
    <path d="M184 306 Q168 296 170 268" stroke="#8b5a2b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M216 306 Q232 296 230 268" stroke="#a0692f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Hands: gripping over the trunk edges -->
    <ellipse cx="166" cy="264" rx="7" ry="6" fill="#5c3a1a"/>
    <ellipse cx="234" cy="264" rx="7" ry="6" fill="#5c3a1a"/>
    <path d="M162 258 Q166 254 170 258" stroke="#3a2410" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M230 258 Q234 254 238 258" stroke="#3a2410" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="200" cy="282" r="20" fill="#a0692f"/>
    <!-- Ears -->
    <circle cx="180" cy="274" r="6" fill="#8b5a2b"/>
    <circle cx="220" cy="274" r="6" fill="#8b5a2b"/>
    <!-- Face -->
    <ellipse cx="200" cy="288" rx="12" ry="10" fill="#e8c39e"/>
    <!-- Eyes -->
    <circle cx="194" cy="279" r="2.5" fill="#1a1a1a"/>
    <circle cx="206" cy="279" r="2.5" fill="#1a1a1a"/>
    <circle cx="195" cy="278" r="0.8" fill="#fff"/>
    <circle cx="207" cy="278" r="0.8" fill="#fff"/>
    <!-- Nose and smile -->
    <ellipse cx="200" cy="287" rx="2.5" ry="1.8" fill="#5c3a1a"/>
    <path d="M194 292 Q200 297 206 292" stroke="#5c3a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="200" y="478" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2d4a22">A monkey climbing an apple tree</text>
</svg>

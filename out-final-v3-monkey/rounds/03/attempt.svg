<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Sky -->
  <rect width="400" height="500" fill="#bfe6ff"/>
  <!-- Sun: saturated gold with a soft glow so it stands out against the sky -->
  <circle cx="330" cy="75" r="50" fill="#ffd60a" opacity="0.35"/>
  <circle cx="330" cy="75" r="36" fill="#ffb703"/>
  <!-- Ground -->
  <rect y="440" width="400" height="60" fill="#7cc35a"/>
  <path d="M0 440 Q100 425 200 440 T400 440 L400 445 L0 445 Z" fill="#6ab04c"/>

  <!-- Tree trunk -->
  <path d="M175 440 L165 260 Q160 230 140 210 L155 205 Q178 225 185 255 L200 255 Q210 225 235 200 L248 210 Q225 232 222 262 L228 440 Z" fill="#8b5a2b"/>

  <!-- Canopy -->
  <g fill="#3f9b3a">
    <circle cx="200" cy="170" r="75"/>
    <circle cx="140" cy="200" r="55"/>
    <circle cx="265" cy="195" r="58"/>
    <circle cx="200" cy="110" r="55"/>
    <circle cx="120" cy="140" r="40"/>
    <circle cx="285" cy="130" r="42"/>
  </g>
  <g fill="#56b84c">
    <circle cx="185" cy="150" r="30"/>
    <circle cx="255" cy="165" r="25"/>
  </g>

  <!-- Apples: apple-shaped (wider than tall, dimple on top), each with a stem and leaf -->
  <g fill="#d62828">
    <path transform="translate(160 130)" d="M0 -6 C4 -11 12 -10 11 -1 C10 8 4 11 0 9 C-4 11 -10 8 -11 -1 C-12 -10 -4 -11 0 -6 Z"/>
    <path transform="translate(232 110)" d="M0 -6 C4 -11 12 -10 11 -1 C10 8 4 11 0 9 C-4 11 -10 8 -11 -1 C-12 -10 -4 -11 0 -6 Z"/>
    <path transform="translate(275 160)" d="M0 -6 C4 -11 12 -10 11 -1 C10 8 4 11 0 9 C-4 11 -10 8 -11 -1 C-12 -10 -4 -11 0 -6 Z"/>
    <path transform="translate(120 180)" d="M0 -6 C4 -11 12 -10 11 -1 C10 8 4 11 0 9 C-4 11 -10 8 -11 -1 C-12 -10 -4 -11 0 -6 Z"/>
    <path transform="translate(205 180)" d="M0 -6 C4 -11 12 -10 11 -1 C10 8 4 11 0 9 C-4 11 -10 8 -11 -1 C-12 -10 -4 -11 0 -6 Z"/>
    <path transform="translate(300 200)" d="M0 -6 C4 -11 12 -10 11 -1 C10 8 4 11 0 9 C-4 11 -10 8 -11 -1 C-12 -10 -4 -11 0 -6 Z"/>
    <path transform="translate(170 210)" d="M0 -6 C4 -11 12 -10 11 -1 C10 8 4 11 0 9 C-4 11 -10 8 -11 -1 C-12 -10 -4 -11 0 -6 Z"/>
  </g>
  <g stroke="#5c3a1a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M160 124 Q159 118 162 113"/>
    <path d="M232 104 Q231 98 234 93"/>
    <path d="M275 154 Q274 148 277 143"/>
    <path d="M120 174 Q119 168 122 163"/>
    <path d="M205 174 Q204 168 207 163"/>
    <path d="M300 194 Q299 188 302 183"/>
    <path d="M170 204 Q169 198 172 193"/>
  </g>
  <g fill="#2d6a2d">
    <ellipse cx="166" cy="114" rx="5" ry="2.5" transform="rotate(-25 166 114)"/>
    <ellipse cx="238" cy="94" rx="5" ry="2.5" transform="rotate(-25 238 94)"/>
    <ellipse cx="281" cy="144" rx="5" ry="2.5" transform="rotate(-25 281 144)"/>
    <ellipse cx="126" cy="164" rx="5" ry="2.5" transform="rotate(-25 126 164)"/>
    <ellipse cx="211" cy="164" rx="5" ry="2.5" transform="rotate(-25 211 164)"/>
    <ellipse cx="306" cy="184" rx="5" ry="2.5" transform="rotate(-25 306 184)"/>
    <ellipse cx="176" cy="194" rx="5" ry="2.5" transform="rotate(-25 176 194)"/>
  </g>

  <!-- Monkey climbing the trunk: two arms, two legs, one tail -->
  <g id="monkey">
    <!-- Tail: separate, curling off to the left side of the body -->
    <path d="M180 334 Q150 336 146 310 Q144 290 160 286" stroke="#7a4a1e" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Legs: start inside the hips and end at feet on the trunk -->
    <path d="M190 340 Q178 352 178 370" stroke="#8b5a2b" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M210 340 Q222 352 222 370" stroke="#a0692f" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Feet: gripping the trunk, attached to the leg ends -->
    <ellipse cx="178" cy="374" rx="8" ry="5" fill="#5c3a1a"/>
    <ellipse cx="222" cy="374" rx="8" ry="5" fill="#5c3a1a"/>

    <!-- Body -->
    <ellipse cx="200" cy="320" rx="22" ry="28" fill="#a0692f"/>
    <!-- Belly -->
    <ellipse cx="200" cy="325" rx="13" ry="18" fill="#e8c39e"/>

    <!-- Arms: start inside the shoulders and end at hands on the trunk -->
    <path d="M186 306 Q164 298 170 270" stroke="#8b5a2b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M214 306 Q236 298 230 270" stroke="#a0692f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Hands: gripping the trunk at the arm ends -->
    <ellipse cx="170" cy="266" rx="7" ry="6" fill="#5c3a1a"/>
    <ellipse cx="230" cy="266" rx="7" ry="6" fill="#5c3a1a"/>

    <!-- Head -->
    <circle cx="200" cy="282" r="20" fill="#a0692f"/>
    <!-- Ears -->
    <circle cx="180" cy="274" r="6" fill="#8b5a2b"/>
    <circle cx="220" cy="274" r="6" fill="#8b5a2b"/>
    <!-- Face -->
    <ellipse cx="200" cy="288" rx="12" ry="10" fill="#e8c39e"/>
    <!-- Eyes -->
    <circle cx="194" cy="279" r="2.5" fill="#1a1a1a"/>
    <circle cx="206" cy="279" r="2.5" fill="#1a1a1a"/>
    <circle cx="195" cy="278" r="0.8" fill="#fff"/>
    <circle cx="207" cy="278" r="0.8" fill="#fff"/>
    <!-- Nose and smile -->
    <ellipse cx="200" cy="287" rx="2.5" ry="1.8" fill="#5c3a1a"/>
    <path d="M194 292 Q200 297 206 292" stroke="#5c3a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="200" y="478" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2d4a22">A monkey climbing an apple tree</text>
</svg>

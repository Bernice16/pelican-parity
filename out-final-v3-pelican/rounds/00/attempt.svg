<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky and ground -->
  <rect width="400" height="300" fill="#cfe9ff"/>
  <rect y="265" width="400" height="35" fill="#8bc34a"/>
  <circle cx="330" cy="50" r="22" fill="#ffd54f"/>

  <!-- Wheels -->
  <g fill="none" stroke="#222" stroke-width="6">
    <circle cx="110" cy="220" r="45"/>
    <circle cx="290" cy="220" r="45"/>
  </g>
  <g stroke="#999" stroke-width="1.5">
    <line x1="110" y1="175" x2="110" y2="265"/>
    <line x1="65" y1="220" x2="155" y2="220"/>
    <line x1="83" y1="193" x2="137" y2="247"/>
    <line x1="137" y1="193" x2="83" y2="247"/>
    <line x1="290" y1="175" x2="290" y2="265"/>
    <line x1="245" y1="220" x2="335" y2="220"/>
    <line x1="263" y1="193" x2="317" y2="247"/>
    <line x1="317" y1="193" x2="263" y2="247"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#d32f2f" stroke-width="6" stroke-linecap="round" fill="none">
    <polyline points="110,220 160,160 250,160 290,220"/>
    <polyline points="190,220 160,160"/>
    <line x1="190" y1="220" x2="250" y2="160"/>
    <line x1="250" y1="160" x2="262" y2="130"/>
    <line x1="252" y1="130" x2="272" y2="130"/>
  </g>
  <rect x="150" y="145" width="22" height="8" rx="3" fill="#222"/>
  <!-- Pedal crank -->
  <circle cx="190" cy="220" r="6" fill="#444"/>

  <!-- Pelican legs -->
  <g stroke="#ff8f00" stroke-width="5" stroke-linecap="round">
    <line x1="180" y1="158" x2="186" y2="216"/>
    <line x1="200" y1="158" x2="196" y2="216"/>
  </g>

  <!-- Pelican tail -->
  <path d="M150,120 L118,100 L128,130 Z" fill="#6d7b8d"/>

  <!-- Pelican body -->
  <ellipse cx="190" cy="128" rx="52" ry="30" transform="rotate(-12 190 128)" fill="#eceff1" stroke="#6d7b8d" stroke-width="2"/>

  <!-- Wing -->
  <path d="M160,118 Q185,95 215,112 Q190,128 160,118 Z" fill="#b0bec5" stroke="#6d7b8d" stroke-width="2"/>

  <!-- Neck and head -->
  <path d="M220,108 Q238,100 240,85" stroke="#eceff1" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="246" cy="82" r="17" fill="#eceff1" stroke="#6d7b8d" stroke-width="2"/>

  <!-- Beak with pouch -->
  <path d="M258,78 L345,96 Q338,118 300,114 Q282,112 262,98 Z" fill="#ffb300" stroke="#e65100" stroke-width="2"/>
  <path d="M262,98 Q282,112 300,114" fill="none" stroke="#e65100" stroke-width="1.5"/>

  <!-- Eye -->
  <circle cx="251" cy="78" r="3.5" fill="#111"/>
  <circle cx="252" cy="77" r="1" fill="#fff"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="268" rx="130" ry="5" fill="#558b2f" opacity="0.5"/>
</svg>

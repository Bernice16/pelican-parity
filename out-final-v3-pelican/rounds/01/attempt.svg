<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky, grass, road -->
  <rect width="400" height="300" fill="#cfe9ff"/>
  <circle cx="330" cy="50" r="22" fill="#ffd54f"/>
  <!-- Distant hills and trees -->
  <path d="M0,215 Q60,185 130,210 T260,205 T400,200 L400,240 L0,240 Z" fill="#a5d6a7"/>
  <circle cx="30" cy="200" r="14" fill="#66bb6a"/>
  <rect x="27" y="210" width="6" height="22" fill="#6d4c41"/>
  <circle cx="370" cy="195" r="16" fill="#66bb6a"/>
  <rect x="367" y="207" width="6" height="25" fill="#6d4c41"/>
  <!-- Grass and road -->
  <rect y="240" width="400" height="25" fill="#8bc34a"/>
  <rect y="265" width="400" height="35" fill="#78909c"/>
  <line x1="0" y1="282" x2="400" y2="282" stroke="#eceff1" stroke-width="2" stroke-dasharray="14,10"/>

  <!-- Wheels -->
  <g fill="none" stroke="#222" stroke-width="6">
    <circle cx="110" cy="220" r="45"/>
    <circle cx="290" cy="220" r="45"/>
  </g>
  <g stroke="#999" stroke-width="1.5">
    <line x1="110" y1="175" x2="110" y2="265"/>
    <line x1="65" y1="220" x2="155" y2="220"/>
    <line x1="83" y1="193" x2="137" y2="247"/>
    <line x1="137" y1="193" x2="83" y2="247"/>
    <line x1="290" y1="175" x2="290" y2="265"/>
    <line x1="245" y1="220" x2="335" y2="220"/>
    <line x1="263" y1="193" x2="317" y2="247"/>
    <line x1="317" y1="193" x2="263" y2="247"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#d32f2f" stroke-width="6" stroke-linecap="round" fill="none">
    <polyline points="110,220 160,160 250,160 290,220"/>
    <polyline points="190,220 160,160"/>
    <line x1="190" y1="220" x2="250" y2="160"/>
    <line x1="250" y1="160" x2="262" y2="130"/>
  </g>
  <!-- Handlebar -->
  <line x1="252" y1="130" x2="276" y2="124" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <!-- Saddle and seat post -->
  <line x1="170" y1="152" x2="165" y2="160" stroke="#444" stroke-width="4"/>
  <rect x="160" y="146" width="28" height="7" rx="3" fill="#222"/>

  <!-- Cranks and pedals -->
  <line x1="190" y1="220" x2="200" y2="234" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="220" x2="180" y2="206" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <rect x="195" y="232" width="12" height="4" rx="1" fill="#222"/>
  <rect x="174" y="204" width="12" height="4" rx="1" fill="#222"/>
  <circle cx="190" cy="220" r="6" fill="#444"/>

  <!-- Pelican legs, feet on pedals -->
  <g stroke="#ff8f00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="186,150 204,180 181,203"/>
    <polyline points="194,150 214,190 201,231"/>
  </g>

  <!-- Pelican tail -->
  <path d="M150,112 L118,92 L128,122 Z" fill="#6d7b8d"/>

  <!-- Pelican body -->
  <ellipse cx="190" cy="120" rx="52" ry="30" transform="rotate(-12 190 120)" fill="#eceff1" stroke="#6d7b8d" stroke-width="2"/>

  <!-- Wing reaching forward to handlebar -->
  <path d="M168,110 Q205,94 254,118 Q258,124 250,128 Q220,120 190,124 Q176,124 168,110 Z" fill="#b0bec5" stroke="#6d7b8d" stroke-width="2"/>

  <!-- Long neck and head -->
  <path d="M222,104 Q244,82 248,56" stroke="#eceff1" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M222,104 Q244,82 248,56" stroke="#6d7b8d" stroke-width="1" stroke-linecap="round" fill="none" transform="translate(0,0)" opacity="0"/>
  <circle cx="252" cy="48" r="17" fill="#eceff1" stroke="#6d7b8d" stroke-width="2"/>

  <!-- Smaller beak with pouch -->
  <path d="M266,42 L316,60 Q310,80 284,78 Q272,76 266,60 Z" fill="#ffb300" stroke="#e65100" stroke-width="2"/>
  <path d="M268,60 Q276,76 284,78" fill="none" stroke="#e65100" stroke-width="1.5"/>

  <!-- Eye -->
  <circle cx="257" cy="44" r="3.5" fill="#111"/>
  <circle cx="258" cy="43" r="1" fill="#fff"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="268" rx="130" ry="5" fill="#455a64" opacity="0.4"/>
</svg>

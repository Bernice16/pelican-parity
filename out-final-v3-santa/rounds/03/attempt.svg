<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#3a6ea5"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e53935"/>
      <stop offset="1" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="sackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1887f"/>
      <stop offset="1" stop-color="#6d4c41"/>
    </linearGradient>
  </defs>

  <!-- Sky and moon -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="110" r="45" fill="#fff8dc"/>
  <circle cx="665" cy="98" r="8" fill="#e8dcb5" opacity="0.6"/>
  <circle cx="695" cy="125" r="5" fill="#e8dcb5" opacity="0.6"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="2"/>
    <circle cx="160" cy="130" r="1.5"/>
    <circle cx="260" cy="50" r="2"/>
    <circle cx="420" cy="90" r="1.5"/>
    <circle cx="520" cy="40" r="2"/>
    <circle cx="590" cy="200" r="1.5"/>
    <circle cx="120" cy="230" r="1.5"/>
    <circle cx="330" cy="180" r="1.5"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 420 Q120 340 260 410 T520 400 T800 380 L800 600 L0 600 Z" fill="#e8f1f8"/>

  <!-- Snow ground -->
  <rect x="0" y="490" width="800" height="110" fill="#ffffff"/>
  <path d="M0 490 Q200 478 400 490 T800 490" stroke="#cfe3f0" stroke-width="4" fill="none"/>

  <!-- Falling snow -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="150" cy="300" r="3"/>
    <circle cx="220" cy="250" r="2.5"/>
    <circle cx="610" cy="300" r="3"/>
    <circle cx="700" cy="240" r="2.5"/>
    <circle cx="560" cy="360" r="2"/>
    <circle cx="100" cy="380" r="2.5"/>
    <circle cx="740" cy="420" r="3"/>
  </g>

  <!-- Scooter, Santa and gifts, scaled 1.3x around the wheel base so Santa fills more of the frame -->
  <g transform="translate(330 524) scale(1.3) translate(-330 -524)">

    <!-- Handlebar stem and bar -->
    <line x1="462" y1="470" x2="470" y2="330" stroke="#37474f" stroke-width="8" stroke-linecap="round"/>
    <line x1="432" y1="330" x2="496" y2="330" stroke="#37474f" stroke-width="8" stroke-linecap="round"/>
    <rect x="488" y="322" width="14" height="16" rx="4" fill="#212121"/>

    <!-- Deck, extended left so every present sits on it -->
    <rect x="186" y="462" width="284" height="12" rx="6" fill="#455a64"/>
    <line x1="310" y1="470" x2="310" y2="490" stroke="#37474f" stroke-width="8"/>
    <line x1="455" y1="470" x2="455" y2="490" stroke="#37474f" stroke-width="8"/>
    <circle cx="310" cy="500" r="24" fill="#212121"/>
    <circle cx="310" cy="500" r="9" fill="#90a4ae"/>
    <circle cx="455" cy="500" r="24" fill="#212121"/>
    <circle cx="455" cy="500" r="9" fill="#90a4ae"/>

    <!-- Gift sack, resting on the deck at the left, clear of Santa's arm -->
    <path d="M200 462 Q186 430 192 404 Q198 382 214 378 Q226 370 240 378 Q256 368 270 380 Q286 394 282 424 Q280 448 276 462 Z" fill="url(#sackGrad)"/>
    <ellipse cx="224" cy="438" rx="10" ry="8" fill="#8d6e63" opacity="0.6"/>
    <ellipse cx="258" cy="428" rx="9" ry="7" fill="#8d6e63" opacity="0.6"/>
    <path d="M218 384 Q238 396 258 384" stroke="#4e342e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M232 388 Q226 376 230 370 Q236 378 238 388 Q244 376 248 370 Q244 380 238 388 Z" fill="#c62828"/>
    <circle cx="238" cy="389" r="4" fill="#b71c1c"/>

    <!-- Blue present resting on the deck in front of the sack -->
    <rect x="192" y="420" width="40" height="42" fill="#1e88e5"/>
    <rect x="210" y="420" width="6" height="42" fill="#ffd54f"/>
    <rect x="192" y="438" width="40" height="6" fill="#ffd54f"/>

    <!-- Santa legs, long enough to stand on the deck -->
    <rect x="344" y="414" width="18" height="40" fill="#212121"/>
    <rect x="376" y="414" width="18" height="40" fill="#212121"/>
    <rect x="338" y="450" width="30" height="14" rx="4" fill="#000000"/>
    <rect x="372" y="450" width="30" height="14" rx="4" fill="#000000"/>

    <!-- Santa body, narrower and taller -->
    <path d="M330 420 Q322 350 352 334 L398 334 Q428 350 422 420 Z" fill="url(#coat)"/>
    <!-- Belt -->
    <rect x="330" y="400" width="92" height="14" fill="#212121"/>
    <rect x="368" y="398" width="16" height="18" fill="#ffd54f" stroke="#8d6e63" stroke-width="2"/>
    <!-- White trim -->
    <rect x="330" y="416" width="92" height="5" fill="#ffffff"/>
    <circle cx="352" cy="370" r="4" fill="#ffffff"/>
    <circle cx="384" cy="368" r="4" fill="#ffffff"/>

    <!-- Right arm reaching the handlebar -->
    <path d="M412 366 Q434 350 446 330" stroke="url(#coat)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <!-- Right hand wrapped around the grip -->
    <circle cx="446" cy="326" r="9" fill="#ffe0b2"/>
    <rect x="430" y="326" width="16" height="8" rx="3" fill="#212121"/>

    <!-- Left arm holding a single gift -->
    <path d="M342 366 Q322 380 302 404" stroke="#b71c1c" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="300" cy="410" r="9" fill="#ffe0b2"/>
    <rect x="288" y="378" width="34" height="30" fill="#fdd835" stroke="#f9a825" stroke-width="2"/>
    <rect x="302" y="378" width="5" height="30" fill="#e53935"/>

    <!-- Head -->
    <circle cx="370" cy="312" r="26" fill="#ffe0b2"/>
    <!-- Beard -->
    <path d="M346 318 Q352 352 370 350 Q390 352 396 318 Q384 334 370 332 Q356 334 346 318 Z" fill="#ffffff"/>
    <!-- Mustache -->
    <ellipse cx="370" cy="324" rx="11" ry="4" fill="#ffffff"/>
    <!-- Cheeks and nose -->
    <circle cx="356" cy="314" r="4" fill="#ff8a80" opacity="0.7"/>
    <circle cx="384" cy="314" r="4" fill="#ff8a80" opacity="0.7"/>
    <circle cx="370" cy="316" r="3" fill="#ef9a9a"/>
    <!-- Eyes -->
    <circle cx="362" cy="306" r="2.5" fill="#212121"/>
    <circle cx="378" cy="306" r="2.5" fill="#212121"/>

    <!-- Hat -->
    <path d="M344 296 Q350 252 372 246 Q400 250 396 296 Z" fill="url(#coat)"/>
    <rect x="340" y="288" width="60" height="12" rx="6" fill="#ffffff"/>
    <circle cx="374" cy="244" r="9" fill="#ffffff"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff59d">
    <path d="M520 220 L523 228 L531 231 L523 234 L520 242 L517 234 L509 231 L517 228 Z"/>
    <path d="M150 180 L152 185 L157 187 L152 189 L150 194 L148 189 L143 187 L148 185 Z"/>
  </g>

  <!-- Title -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Merry Christmas from Santa!</text>
</svg>

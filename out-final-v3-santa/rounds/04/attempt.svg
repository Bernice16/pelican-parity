<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#3a6ea5"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e53935"/>
      <stop offset="1" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="sackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1887f"/>
      <stop offset="1" stop-color="#6d4c41"/>
    </linearGradient>
  </defs>

  <!-- Sky and moon -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="110" r="45" fill="#fff8dc"/>
  <circle cx="665" cy="98" r="8" fill="#e8dcb5" opacity="0.6"/>
  <circle cx="695" cy="125" r="5" fill="#e8dcb5" opacity="0.6"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="2"/>
    <circle cx="160" cy="130" r="1.5"/>
    <circle cx="260" cy="50" r="2"/>
    <circle cx="420" cy="90" r="1.5"/>
    <circle cx="520" cy="40" r="2"/>
    <circle cx="590" cy="200" r="1.5"/>
    <circle cx="120" cy="230" r="1.5"/>
    <circle cx="330" cy="180" r="1.5"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 420 Q120 340 260 410 T520 400 T800 380 L800 600 L0 600 Z" fill="#e8f1f8"/>

  <!-- Snow ground -->
  <rect x="0" y="490" width="800" height="110" fill="#ffffff"/>
  <path d="M0 490 Q200 478 400 490 T800 490" stroke="#cfe3f0" stroke-width="4" fill="none"/>

  <!-- Falling snow -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="150" cy="300" r="3"/>
    <circle cx="220" cy="250" r="2.5"/>
    <circle cx="610" cy="300" r="3"/>
    <circle cx="700" cy="240" r="2.5"/>
    <circle cx="560" cy="360" r="2"/>
    <circle cx="100" cy="380" r="2.5"/>
    <circle cx="740" cy="420" r="3"/>
  </g>

  <!-- Scooter, Santa and gifts, scaled 1.3x around the wheel base so Santa fills more of the frame -->
  <g transform="translate(330 524) scale(1.3) translate(-330 -524)">

    <!-- Handlebar stem and bar -->
    <line x1="455" y1="470" x2="466" y2="330" stroke="#37474f" stroke-width="8" stroke-linecap="round"/>
    <line x1="430" y1="330" x2="496" y2="330" stroke="#37474f" stroke-width="8" stroke-linecap="round"/>
    <rect x="488" y="322" width="14" height="16" rx="4" fill="#212121"/>

    <!-- Kick-scooter deck: slim, just long enough for the rider and the sack -->
    <rect x="200" y="462" width="262" height="9" rx="4.5" fill="#455a64"/>
    <line x1="310" y1="470" x2="310" y2="490" stroke="#37474f" stroke-width="7"/>
    <line x1="455" y1="470" x2="455" y2="490" stroke="#37474f" stroke-width="7"/>
    <circle cx="310" cy="500" r="22" fill="#212121"/>
    <circle cx="310" cy="500" r="8" fill="#90a4ae"/>
    <circle cx="455" cy="500" r="22" fill="#212121"/>
    <circle cx="455" cy="500" r="8" fill="#90a4ae"/>

    <!-- Gift sack resting on the deck at the left -->
    <path d="M206 462 Q194 430 200 404 Q206 382 220 378 Q232 370 244 378 Q256 368 266 380 Q276 394 272 424 Q270 448 266 462 Z" fill="url(#sackGrad)"/>
    <ellipse cx="226" cy="440" rx="9" ry="7" fill="#8d6e63" opacity="0.6"/>
    <ellipse cx="252" cy="430" rx="8" ry="6" fill="#8d6e63" opacity="0.6"/>
    <path d="M222 384 Q238 394 254 384" stroke="#4e342e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M234 388 Q228 377 232 371 Q238 379 240 388 Q246 377 250 371 Q246 381 240 388 Z" fill="#c62828"/>
    <circle cx="240" cy="389" r="3.5" fill="#b71c1c"/>

    <!-- Blue present standing on the deck in front of the sack -->
    <rect x="206" y="424" width="34" height="38" fill="#1e88e5"/>
    <rect x="221" y="424" width="5" height="38" fill="#ffd54f"/>
    <rect x="206" y="440" width="34" height="5" fill="#ffd54f"/>

    <!-- Santa legs in side view, the front leg reaching toward the handlebar -->
    <rect x="344" y="414" width="16" height="40" fill="#212121"/>
    <rect x="384" y="414" width="16" height="40" fill="#212121"/>
    <rect x="338" y="450" width="28" height="14" rx="4" fill="#000000"/>
    <rect x="380" y="450" width="40" height="14" rx="4" fill="#000000"/>

    <!-- Santa body, turned sideways toward the handlebar -->
    <path d="M342 420 Q334 352 356 336 L390 336 Q410 352 406 420 Z" fill="url(#coat)"/>
    <!-- Belt -->
    <rect x="340" y="400" width="68" height="13" fill="#212121"/>
    <rect x="370" y="398" width="14" height="17" fill="#ffd54f" stroke="#8d6e63" stroke-width="2"/>
    <!-- White trim -->
    <rect x="340" y="416" width="68" height="5" fill="#ffffff"/>
    <circle cx="362" cy="372" r="3.5" fill="#ffffff"/>

    <!-- Right arm reaching the handlebar grip -->
    <path d="M396 364 Q420 350 446 330" stroke="#c62828" stroke-width="20" stroke-linecap="round" fill="none"/>
    <circle cx="446" cy="326" r="8" fill="#ffe0b2"/>
    <rect x="430" y="326" width="16" height="8" rx="3" fill="#212121"/>

    <!-- Left arm holding a gift out in front -->
    <path d="M352 362 Q326 376 308 392" stroke="#b71c1c" stroke-width="20" stroke-linecap="round" fill="none"/>
    <!-- Gift held in the hand: box sits beside the fingers, hand drawn over its edge -->
    <rect x="276" y="374" width="30" height="28" fill="#fdd835" stroke="#f9a825" stroke-width="2"/>
    <rect x="289" y="374" width="5" height="28" fill="#e53935"/>
    <circle cx="308" cy="392" r="8" fill="#ffe0b2"/>

    <!-- Head, smaller for balance with the body -->
    <circle cx="372" cy="318" r="20" fill="#ffe0b2"/>
    <!-- Beard -->
    <path d="M354 322 Q358 348 372 346 Q388 348 390 322 Q380 334 372 333 Q362 334 354 322 Z" fill="#ffffff"/>
    <!-- Mustache -->
    <ellipse cx="372" cy="328" rx="8" ry="3" fill="#ffffff"/>
    <!-- Cheek and nose -->
    <circle cx="362" cy="318" r="3" fill="#ff8a80" opacity="0.7"/>
    <circle cx="372" cy="321" r="2.5" fill="#ef9a9a"/>
    <!-- Eye -->
    <circle cx="380" cy="311" r="2" fill="#212121"/>

    <!-- Hat -->
    <path d="M356 304 Q360 272 374 266 Q392 270 390 304 Z" fill="url(#coat)"/>
    <rect x="352" y="298" width="42" height="9" rx="4.5" fill="#ffffff"/>
    <circle cx="374" cy="265" r="7" fill="#ffffff"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff59d">
    <path d="M520 220 L523 228 L531 231 L523 234 L520 242 L517 234 L509 231 L517 228 Z"/>
    <path d="M150 180 L152 185 L157 187 L152 189 L150 194 L148 189 L143 187 L148 185 Z"/>
  </g>

  <!-- Title -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Merry Christmas from Santa!</text>
</svg>

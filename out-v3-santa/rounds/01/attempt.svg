<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#2a4d7a"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe9f5"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#sky)"/>
  <circle cx="500" cy="70" r="28" fill="#fff7d6"/>

  <!-- Distant pine trees -->
  <g fill="#0f3b33">
    <path d="M40 250 L18 300 L62 300 Z"/>
    <path d="M40 272 L10 335 L70 335 Z"/>
    <path d="M96 282 L80 315 L112 315 Z"/>
    <path d="M96 298 L74 340 L118 340 Z"/>
    <path d="M545 262 L524 305 L566 305 Z"/>
    <path d="M545 284 L514 340 L576 340 Z"/>
    <path d="M582 290 L570 318 L594 318 Z"/>
    <path d="M582 304 L562 340 L602 340 Z"/>
  </g>

  <!-- Ground -->
  <path d="M0 330 Q150 300 300 325 T600 320 L600 400 L0 400 Z" fill="url(#snow)"/>

  <!-- Snowflakes -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="110" r="2"/>
    <circle cx="220" cy="40" r="2.5"/>
    <circle cx="340" cy="90" r="3"/>
    <circle cx="430" cy="150" r="2"/>
    <circle cx="560" cy="200" r="2.5"/>
    <circle cx="90" cy="200" r="2"/>
    <circle cx="260" cy="160" r="2"/>
    <circle cx="520" cy="30" r="2"/>
    <circle cx="30" cy="150" r="2"/>
    <circle cx="150" cy="190" r="2.5"/>
    <circle cx="300" cy="30" r="2"/>
    <circle cx="380" cy="120" r="2"/>
    <circle cx="470" cy="240" r="2.5"/>
    <circle cx="230" cy="90" r="1.5"/>
    <circle cx="400" cy="40" r="1.5"/>
    <circle cx="540" cy="120" r="2"/>
    <circle cx="180" cy="20" r="1.5"/>
    <circle cx="80" cy="140" r="1.5"/>
    <circle cx="330" cy="230" r="2"/>
    <circle cx="115" cy="235" r="1.5"/>
    <circle cx="600" cy="150" r="1.5"/>
    <circle cx="20" cy="95" r="1.5"/>
    <circle cx="460" cy="95" r="1.5"/>
    <circle cx="250" cy="260" r="1.5"/>
  </g>

  <!-- Scooter wheels -->
  <g>
    <circle cx="180" cy="318" r="26" fill="#222"/>
    <circle cx="180" cy="318" r="10" fill="#888"/>
    <circle cx="410" cy="318" r="26" fill="#222"/>
    <circle cx="410" cy="318" r="10" fill="#888"/>
  </g>

  <!-- Scooter deck and stem -->
  <rect x="170" y="300" width="260" height="12" rx="5" fill="#2f6fd6"/>
  <line x1="405" y1="300" x2="420" y2="170" stroke="#2f6fd6" stroke-width="10" stroke-linecap="round"/>
  <line x1="405" y1="175" x2="450" y2="170" stroke="#1d4fa0" stroke-width="9" stroke-linecap="round"/>

  <!-- Presents stacked on the deck, clear of the rear wheel -->
  <g>
    <rect x="200" y="262" width="40" height="38" fill="#c62828"/>
    <rect x="216" y="262" width="6" height="38" fill="#ffd54f"/>
    <rect x="200" y="276" width="40" height="6" fill="#ffd54f"/>
    <rect x="204" y="230" width="32" height="32" fill="#2e7d32"/>
    <rect x="218" y="230" width="5" height="32" fill="#ffffff"/>
    <rect x="204" y="242" width="32" height="5" fill="#ffffff"/>
    <rect x="208" y="210" width="24" height="20" fill="#ffb300"/>
    <rect x="218" y="210" width="4" height="20" fill="#c62828"/>
  </g>

  <!-- Santa's torso -->
  <ellipse cx="270" cy="222" rx="44" ry="52" fill="#d32f2f"/>
  <rect x="233" y="250" width="74" height="10" fill="#111"/>
  <rect x="262" y="246" width="16" height="18" rx="2" fill="#ffd54f"/>

  <!-- Legs (thighs and shins down to the boots) -->
  <line x1="255" y1="262" x2="254" y2="296" stroke="#111" stroke-width="16" stroke-linecap="round"/>
  <line x1="285" y1="262" x2="304" y2="296" stroke="#111" stroke-width="16" stroke-linecap="round"/>

  <!-- Santa's boots -->
  <rect x="245" y="288" width="24" height="22" rx="4" fill="#111"/>
  <rect x="292" y="288" width="24" height="22" rx="4" fill="#111"/>

  <!-- Far arm resting at his side -->
  <line x1="240" y1="200" x2="226" y2="252" stroke="#b71c1c" stroke-width="14" stroke-linecap="round"/>
  <rect x="219" y="250" width="14" height="6" rx="2" fill="#111"/>
  <circle cx="224" cy="258" r="7" fill="#ffffff"/>

  <!-- Near arm reaching to handlebar -->
  <line x1="300" y1="205" x2="400" y2="180" stroke="#d32f2f" stroke-width="16" stroke-linecap="round"/>
  <circle cx="404" cy="178" r="10" fill="#ffffff"/>

  <!-- Santa's head -->
  <circle cx="275" cy="168" r="30" fill="#f6c9a0"/>

  <!-- Hat -->
  <path d="M243 150 Q262 62 312 112 L306 150 Z" fill="#d32f2f"/>
  <circle cx="314" cy="110" r="10" fill="#ffffff"/>
  <rect x="236" y="138" width="78" height="18" rx="8" fill="#ffffff"/>

  <!-- Beard and face -->
  <ellipse cx="275" cy="190" rx="30" ry="22" fill="#ffffff"/>
  <circle cx="263" cy="166" r="3" fill="#222"/>
  <circle cx="288" cy="166" r="3" fill="#222"/>
  <circle cx="275" cy="178" r="4" fill="#e57373"/>
  <path d="M262 186 Q275 196 288 186" stroke="#c9c9c9" stroke-width="2" fill="none"/>

  <!-- Greeting, placed clear of the snowflakes -->
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Merry Christmas!</text>
</svg>

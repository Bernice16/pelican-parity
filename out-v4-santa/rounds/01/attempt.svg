<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#2a4d7a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="60" cy="50" r="2"/>
    <circle cx="150" cy="90" r="1.5"/>
    <circle cx="320" cy="40" r="2"/>
    <circle cx="480" cy="70" r="1.5"/>
    <circle cx="640" cy="45" r="2"/>
    <circle cx="730" cy="110" r="1.5"/>
    <circle cx="240" cy="130" r="1"/>
    <circle cx="560" cy="150" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="700" cy="80" r="30" fill="#fff8dc"/>

  <!-- Snow ground -->
  <rect x="0" y="400" width="800" height="100" fill="#f5fbff"/>
  <ellipse cx="200" cy="405" rx="260" ry="14" fill="#e6f2fb"/>
  <ellipse cx="620" cy="410" rx="300" ry="16" fill="#e6f2fb"/>

  <!-- Scooter and Santa, scaled up and set so the wheels rest on the snow -->
  <g transform="translate(-132.5 -210.5) scale(1.5)">

    <!-- Sack resting on the deck, with presents inside it -->
    <path d="M 262 355 Q 244 300 268 262 Q 290 240 306 262 L 310 355 Z" fill="#8b5a2b"/>
    <rect x="268" y="276" width="26" height="22" fill="#e63946"/>
    <rect x="279" y="276" width="4" height="22" fill="#f4c542"/>
    <rect x="276" y="300" width="24" height="20" fill="#457b9d"/>
    <rect x="286" y="300" width="4" height="20" fill="#f4c542"/>

    <!-- Deck -->
    <line x1="280" y1="360" x2="440" y2="360" stroke="#d62828" stroke-width="10" stroke-linecap="round"/>
    <!-- Handlebar stem -->
    <line x1="430" y1="360" x2="450" y2="250" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <!-- Handlebar with grips -->
    <line x1="412" y1="248" x2="478" y2="248" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <circle cx="412" cy="248" r="5" fill="#111"/>
    <circle cx="478" cy="248" r="5" fill="#111"/>

    <!-- Wheels -->
    <circle cx="290" cy="385" r="22" fill="#222"/>
    <circle cx="290" cy="385" r="8" fill="#bbb"/>
    <circle cx="440" cy="385" r="22" fill="#222"/>
    <circle cx="440" cy="385" r="8" fill="#bbb"/>

    <!-- Legs and boots -->
    <rect x="330" y="330" width="22" height="35" fill="#b00000"/>
    <rect x="356" y="330" width="22" height="35" fill="#b00000"/>
    <rect x="322" y="355" width="30" height="12" rx="4" fill="#111"/>
    <rect x="352" y="355" width="30" height="12" rx="4" fill="#111"/>

    <!-- Torso and belt -->
    <rect x="325" y="260" width="70" height="75" rx="18" fill="#d62828"/>
    <rect x="325" y="312" width="70" height="10" fill="#111"/>
    <rect x="356" y="310" width="8" height="14" fill="#f4c542"/>

    <!-- Arms reaching the handlebar -->
    <line x1="340" y1="275" x2="420" y2="250" stroke="#d62828" stroke-width="14" stroke-linecap="round"/>
    <line x1="380" y1="275" x2="455" y2="255" stroke="#d62828" stroke-width="14" stroke-linecap="round"/>
    <!-- Hands wrapped around the grips -->
    <circle cx="420" cy="250" r="7" fill="#f2c9a0" stroke="#111" stroke-width="2"/>
    <circle cx="455" cy="255" r="7" fill="#f2c9a0" stroke="#111" stroke-width="2"/>

    <!-- Head -->
    <circle cx="360" cy="235" r="20" fill="#f2c9a0"/>
    <!-- Hat -->
    <path d="M 340 230 Q 345 180 370 190 L 395 220 Q 375 215 360 218 Z" fill="#d62828"/>
    <circle cx="390" cy="222" r="5" fill="#fff"/>
    <rect x="338" y="222" width="46" height="8" rx="4" fill="#fff"/>
    <!-- Beard -->
    <path d="M 340 240 Q 360 275 380 240 Q 360 250 340 240 Z" fill="#fff"/>
    <path d="M 342 238 Q 360 262 378 238 L 378 246 Q 360 270 342 246 Z" fill="#f5f5f5"/>
    <!-- Eyes and cheeks -->
    <circle cx="352" cy="232" r="2" fill="#111"/>
    <circle cx="368" cy="232" r="2" fill="#111"/>
    <circle cx="348" cy="240" r="3" fill="#f08080" opacity="0.6"/>
    <circle cx="372" cy="240" r="3" fill="#f08080" opacity="0.6"/>
  </g>

  <!-- Caption on a dark panel so it reads clearly against the snow -->
  <rect x="236" y="438" width="328" height="42" rx="8" fill="#0b1d3a" opacity="0.9"/>
  <text x="400" y="467" font-family="Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle">Santa on a Scooter</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#2a4d7a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="60" cy="50" r="2"/>
    <circle cx="150" cy="90" r="1.5"/>
    <circle cx="320" cy="40" r="2"/>
    <circle cx="480" cy="70" r="1.5"/>
    <circle cx="640" cy="45" r="2"/>
    <circle cx="730" cy="110" r="1.5"/>
    <circle cx="240" cy="130" r="1"/>
    <circle cx="560" cy="150" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="700" cy="80" r="30" fill="#fff8dc"/>

  <!-- Snow ground -->
  <rect x="0" y="434" width="800" height="66" fill="#f5fbff"/>
  <ellipse cx="200" cy="436" rx="260" ry="10" fill="#e6f2fb"/>
  <ellipse cx="620" cy="440" rx="300" ry="12" fill="#e6f2fb"/>

  <!-- Scooter and Santa, larger and centred, wheels resting on the snow -->
  <g transform="translate(-230 -295) scale(1.8)">

    <!-- Sack body -->
    <path d="M 236 355 Q 222 300 246 266 Q 262 254 280 266 Q 292 300 290 355 Z" fill="#8b5a2b"/>
    <!-- Dark opening of the sack -->
    <ellipse cx="263" cy="266" rx="20" ry="6" fill="#3a2410"/>
    <!-- Presents poking out of the opening -->
    <rect x="248" y="248" width="22" height="20" fill="#e63946"/>
    <rect x="257" y="248" width="3" height="20" fill="#f4c542"/>
    <rect x="268" y="242" width="18" height="18" fill="#457b9d"/>
    <rect x="275" y="242" width="3" height="18" fill="#f4c542"/>
    <!-- Sack neck gathered and tied with a bow -->
    <path d="M 243 268 Q 263 282 285 268" fill="none" stroke="#5a3a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M 258 276 Q 263 270 268 276 Q 263 282 258 276 Z" fill="#f4c542"/>

    <!-- Deck -->
    <line x1="230" y1="360" x2="440" y2="360" stroke="#d62828" stroke-width="10" stroke-linecap="round"/>
    <!-- Steering column running down to the front axle -->
    <line x1="440" y1="385" x2="450" y2="250" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <!-- Handlebar with grips -->
    <line x1="412" y1="248" x2="478" y2="248" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <circle cx="412" cy="248" r="5" fill="#111"/>
    <circle cx="478" cy="248" r="5" fill="#111"/>

    <!-- Wheels -->
    <circle cx="290" cy="385" r="22" fill="#222"/>
    <circle cx="290" cy="385" r="8" fill="#bbb"/>
    <circle cx="440" cy="385" r="22" fill="#222"/>
    <circle cx="440" cy="385" r="8" fill="#bbb"/>

    <!-- Legs with knees and trouser cuffs tucked into boots -->
    <path d="M 334 330 L 332 350 L 340 358 L 344 350 L 344 330 Z" fill="#b00000"/>
    <path d="M 358 330 L 362 350 L 368 358 L 374 350 L 370 330 Z" fill="#b00000"/>
    <rect x="322" y="354" width="28" height="13" rx="4" fill="#111"/>
    <rect x="354" y="354" width="28" height="13" rx="4" fill="#111"/>
    <rect x="332" y="346" width="12" height="4" fill="#7a0000"/>
    <rect x="360" y="346" width="12" height="4" fill="#7a0000"/>

    <!-- Torso and belt -->
    <rect x="325" y="260" width="70" height="75" rx="18" fill="#d62828"/>
    <rect x="325" y="312" width="70" height="10" fill="#111"/>
    <rect x="356" y="310" width="8" height="14" fill="#f4c542"/>

    <!-- Far arm (darker red), from the left shoulder to the left grip -->
    <path d="M 336 272 Q 370 292 412 250" fill="none" stroke="#9d0208" stroke-width="11" stroke-linecap="round"/>
    <!-- Near arm (brighter red), from the right shoulder to the right grip -->
    <path d="M 384 272 Q 424 286 458 250" fill="none" stroke="#d62828" stroke-width="11" stroke-linecap="round"/>

    <!-- Mittens gripping the handlebar -->
    <circle cx="412" cy="248" r="7" fill="#111"/>
    <circle cx="458" cy="248" r="7" fill="#111"/>

    <!-- Head -->
    <circle cx="360" cy="233" r="24" fill="#f2c9a0"/>

    <!-- Hat -->
    <path d="M 336 212 Q 338 176 372 176 Q 392 178 398 192 L 384 214 Q 370 206 352 212 Z" fill="#d62828"/>
    <circle cx="398" cy="190" r="6" fill="#fff"/>
    <rect x="332" y="206" width="56" height="12" rx="6" fill="#fff"/>

    <!-- Beard -->
    <path d="M 336 236 Q 332 270 360 272 Q 388 270 384 236 Q 378 248 360 246 Q 342 248 336 236 Z" fill="#fff"/>
    <path d="M 346 252 Q 360 262 374 252" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round"/>
    <!-- Moustache -->
    <path d="M 348 244 Q 354 240 360 244 Q 366 240 372 244 Q 366 248 360 246 Q 354 248 348 244 Z" fill="#f5f5f5"/>

    <!-- Nose -->
    <ellipse cx="360" cy="236" rx="3" ry="4" fill="#e8a87c"/>
    <!-- Eyes with brows -->
    <circle cx="350" cy="228" r="2.5" fill="#111"/>
    <circle cx="370" cy="228" r="2.5" fill="#111"/>
    <path d="M 345 223 Q 350 220 355 223" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 365 223 Q 370 220 375 223" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="344" cy="238" r="3.5" fill="#f08080" opacity="0.6"/>
    <circle cx="376" cy="238" r="3.5" fill="#f08080" opacity="0.6"/>
  </g>

  <!-- Caption panel -->
  <rect x="270" y="458" width="260" height="30" rx="8" fill="#0b1d3a" opacity="0.9"/>
  <text x="400" y="479" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">Santa on a Scooter</text>
</svg>
